<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dã Quỳ Decor &amp; Event</title>
    <script type="text/javascript">
      // SPA GitHub Pages redirect script (supports custom domain or repo path)
      // pathSegmentsToKeep: 0 for custom domain (e.g. trangtritieccuoicaocap.com), 1 for username.github.io/repo-name/
      var pathSegmentsToKeep = window.location.hostname.indexOf('github.io') > -1 ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
